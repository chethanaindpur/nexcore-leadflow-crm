<!DOCTYPE html>
<html>

<head>

    <title>Login</title>
    <link rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='favicon.svg') }}">

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:350px;
            margin:auto;
            margin-top:100px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            background:#007bff;
            color:white;
            padding:12px 20px;
            border:none;
            border-radius:5px;
            width:100%;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 style="
display:flex;
align-items:center;
justify-content:center;
gap:15px;
font-size:42px;
margin-bottom:40px;
white-space:nowrap;
">

NexCore Login 🔐

</h1>
    <form method="POST" action="/login" style="
display:flex;
flex-direction:column;
align-items:center;
">

        <input
type="text"
name="username"
placeholder="Username"
style="
width:90%;
padding:15px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
"
>

        <input
type="password"
name="password"
placeholder="Password"
style="
width:90%;
padding:15px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
"
>

        <button type="submit" style="
width:90%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
">
Login
</button>

    </form>

</div>

</body>
</html>
