<!DOCTYPE html>
<html>

<head>

    <title>AI Assistant</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container{
            width:70%;
            margin:auto;
            margin-top:50px;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        h1{
            color:#1e293b;
        }

        textarea{
            width:100%;
            height:120px;
            padding:15px;
            margin-top:20px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            margin-top:20px;
            background:#7c3aed;
            color:white;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        .response{
            margin-top:30px;
            background:#0f172a;
            color:white;
            padding:25px;
            border-radius:12px;
            line-height:1.8;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🤖 NexCore AI Assistant</h1>

        <form method="POST">

            <textarea
            name="question"
            placeholder="Ask AI anything about leads, sales, follow-ups, business growth..."></textarea>

            <br>

            <button type="submit">
                Ask AI
            </button>

        </form>

        {% if response %}

        <div class="response">

            {{ response }}

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
