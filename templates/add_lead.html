<!DOCTYPE html>
<html>

<head>
    <title>Add Lead</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f6f9;
        }

        .container{
            width:50%;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        input, select{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            background:#007bff;
            color:white;
            padding:12px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add New Lead</h1>

    <form method="POST">

        <label>Customer Name</label>
        <input type="text" name="customer_name">
        

        <label>Phone Number</label>
        <input type="text" name="phone_number">
        <input
type="email"
name="email"
placeholder="Customer Email"
style="padding:12px;width:300px;margin-bottom:15px;"
>

        <label>Business Type</label>
        <input type="text" name="business_type">
        

        <label>Status</label>
        <label>Follow-Up Date</label>

<input type="date" name="followup_date">


        <select name="status">

            <option value="Pending">Pending</option>

            <option value="Contacted">Contacted</option>

            <option value="Closed">Closed</option>

        </select>

        <button type="submit">Save Lead</button>

    </form>

</div>

</body>
</html>
